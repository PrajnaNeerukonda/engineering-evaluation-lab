
name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run evaluation engine
        run: python evaluation/evaluate.py

      - name: Compare candidates
        run: python benchmarks/compare_candidates.py

      - name: Generate ranking and summary
        run: python benchmarks/summary.py

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/
          if-no-files-found: warn
