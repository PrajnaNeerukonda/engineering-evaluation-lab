
name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

      - name: Run evaluation engine
        run: python evaluation/evaluate.py

      - name: Run candidate comparison
        run: python benchmarks/compare_candidates.py

      - name: Generate candidate ranking and summary
        run: python benchmarks/summary.py

      - name: Generate test cases
        run: python evaluation/test_generator.py

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            reports/scorecard.json
            reports/candidate_comparison.json
            reports/summary.json
            reports/generated_test_cases.json
          if-no-files-found: warn

      - name: Prepare GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/data

          cp index.html site/index.html

          cp reports/candidate_comparison.json \
            site/data/candidate_comparison.json

          cp reports/generated_test_cases.json \
            site/data/generated_test_cases.json

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
