name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

      - name: Run evaluation engine
        run: python evaluation/evaluate.py

      - name: Run candidate comparison
        run: python benchmarks/compare_candidates.py

      - name: Generate candidate ranking and summary
        run: python benchmarks/summary.py

      - name: Generate test cases
        run: python evaluation/test_generator.py

      - name: Prepare dashboard data
        run: |
          mkdir -p data

          test -f reports/candidate_comparison.json
          test -f reports/generated_test_cases.json

          cp reports/candidate_comparison.json data/
          cp reports/generated_test_cases.json data/

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            reports/scorecard.json
            reports/candidate_comparison.json
            reports/summary.json
            reports/generated_test_cases.json
          if-no-files-found: warn

      - name: Publish dashboard data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/candidate_comparison.json
          git add data/generated_test_cases.json

          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard data [skip ci]"
            git push
          else
            echo "Dashboard data is already up to date."
          fi
