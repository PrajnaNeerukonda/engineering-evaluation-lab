
name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

      - name: Run evaluation engine
        run: python evaluation/evaluate.py

      - name: Run candidate comparison
        run: python benchmarks/compare_candidates.py

      - name: Generate candidate ranking and summary
        run: python benchmarks/summary.py

      - name: Generate test cases
        run: python evaluation/test_generator.py

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            reports/scorecard.json
            reports/candidate_comparison.json
            reports/summary.json
            reports/generated_test_cases.json
          if-no-files-found: warn
      - name: Prepare dashboard data
        if: always()
        run: |
          mkdir -p dashboard/data
          cp reports/candidate_comparison.json dashboard/data/ || true
          cp reports/generated_test_cases.json dashboard/data/ || true
